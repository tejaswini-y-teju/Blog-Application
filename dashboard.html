<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h2 class="logo">BlogSpace</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
        </div>
    </nav>
</header>

<section class="dashboard">

    <h1>Welcome, <span id="userName">User</span>!</h1>
    <p>Manage your blogs and create new content.</p>

    <button onclick="logoutUser()">Logout</button>

    <!-- User Profile -->
    <div class="profile-card">
        <h2>Your Profile</h2>
        <p><strong>Name:</strong> <span id="profileName">User</span></p>
        <p><strong>Email:</strong> <span id="profileEmail">Email</span></p>
    </div>

    <div class="dashboard-cards">

        <div class="stat-card">
            <h3 id="totalBlogs">0</h3>
            <p>Total Blogs</p>
        </div>

        <div class="stat-card">
            <h3>1,250</h3>
            <p>Total Views</p>
        </div>

        <div class="stat-card">
            <h3>85</h3>
            <p>Likes</p>
        </div>

    </div>

    <a href="create-blog.html" class="btn">+ Create New Blog</a>

    <h2 class="section-title">Your Recent Blogs</h2>

    <div class="blog-container" id="blogContainer">
        <p>Loading blogs...</p>
    </div>

</section>

<script src="script.js"></script>

</body>
</html>
