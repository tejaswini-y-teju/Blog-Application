<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h2 class="logo">BlogSpace</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
        </div>
    </nav>
</header>

<section class="dashboard">

    <h1>Dashboard</h1>
    <p>Manage your blogs and create new content.</p>

    <div class="dashboard-cards">

        <div class="stat-card">
            <h3>12</h3>
            <p>Total Blogs</p>
        </div>

        <div class="stat-card">
            <h3>1,250</h3>
            <p>Total Views</p>
        </div>

        <div class="stat-card">
            <h3>85</h3>
            <p>Likes</p>
        </div>

    </div>

    <a href="create-blog.html" class="btn">+ Create New Blog</a>

    <h2 class="section-title">Your Recent Blogs</h2>

    <div class="blog-container">

        <div class="blog-card">
            <h3>My First Blog</h3>
            <p>My experience starting web development.</p>
            <button>Edit</button>
        </div>

        <div class="blog-card">
            <h3>Learning HTML & CSS</h3>
            <p>Things I learned while building websites.</p>
            <button>Edit</button>
        </div>

    </div>

</section>

</body>
</html>
